[project]
name = "spikeos-api"
version = "0.1.0"
description = "SpikeOS Communication Effectiveness Platform API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
